# SchoolLink on one server (docs/DEPLOYMENT.md): PostgreSQL, the API and Caddy (HTTPS + web dashboard).
# Usage, from this folder:  cp .env.example .env  (then fill it in),  docker compose up -d --build
name: schoollink

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-schoollink}
      POSTGRES_USER: ${DB_USER:-schoollink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Africa/Douala
      PGTZ: Africa/Douala
    volumes:
      - db-data:/var/lib/postgresql/data
    # no ports: the database is reachable from the API only, never from the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-schoollink}
      DB_USER: ${DB_USER:-schoollink}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Caddy, on the private Docker network, gives the real client address (login rate limits, NFR-7)
      TRUSTED_PROXIES: '172\.(1[6-9]|2[0-9]|3[01])\.\d{1,3}\.\d{1,3}'
      FIREBASE_CREDENTIALS: /run/secrets/firebase-service-account.json
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?set TWILIO_ACCOUNT_SID in .env}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?set TWILIO_AUTH_TOKEN in .env}
      TWILIO_FROM: ${TWILIO_FROM:?set TWILIO_FROM in .env}
      SMS_STATUS_CALLBACK_URL: https://${SCHOOLLINK_DOMAIN}/api/v1/webhooks/sms/delivery
      # creates one school and its first admin at start-up, once (README, Phase 1 walkthrough)
      SCHOOLLINK_BOOTSTRAP_SCHOOL_NAME: ${BOOTSTRAP_SCHOOL_NAME:-}
      SCHOOLLINK_BOOTSTRAP_SCHOOL_LANGUAGE: ${BOOTSTRAP_SCHOOL_LANGUAGE:-FR}
      SCHOOLLINK_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      SCHOOLLINK_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      TZ: Africa/Douala
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    # no ports: only Caddy reaches the API

  caddy:
    build: ../web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SCHOOLLINK_DOMAIN: ${SCHOOLLINK_DOMAIN:?set SCHOOLLINK_DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./downloads:/downloads:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
