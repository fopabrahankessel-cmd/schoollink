# Runs every test suite on each push and pull request, so a red build is seen the day it happens.
# Generated data only (CLAUDE.md): no job needs secrets, a Firebase project or a real school file.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit + integration, Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Docker is preinstalled on the runner; Testcontainers starts PostgreSQL 16 itself.
      - run: ./mvnw -B -ntp verify
      - name: Keep test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  web:
    name: Web (lint, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Mobile (analyze, tests, APK size)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      # NFR-12: the committed localizations must match the ARB files.
      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          dart format lib/core/db/database.g.dart
          git diff --exit-code -- lib/
      - run: flutter analyze
      - run: flutter test
      # NFR-4: each split APK stays under 30 MB. Without key.properties the build signs with the
      # debug key and without google-services.json it builds without push (D23), so no secret is needed.
      - run: flutter build apk --release --split-per-abi
      - name: Each APK is under 30 MB (NFR-4)
        run: |
          status=0
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            size=$(stat -c %s "$apk")
            echo "$(basename "$apk"): $((size / 1024 / 1024)) MB"
            if [ "$size" -ge $((30 * 1024 * 1024)) ]; then status=1; fi
          done
          exit $status
