# Local development infrastructure for SchoolLink.
# Usage: docker compose up -d db   (values come from .env, see .env.example)
name: schoollink

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-schoollink}
      POSTGRES_USER: ${DB_USER:-schoollink}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-schoollink}
      TZ: Africa/Douala
      PGTZ: Africa/Douala
    ports:
      # Host port defaults to 5433 so it does not clash with a locally installed PostgreSQL on 5432.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
