# Messages d'erreur de l'API (SPEC §9, NFR-12). Clé : error.<code>. Apostrophe : ''.
error.internal=Une erreur inattendue s''est produite. Veuillez réessayer.
error.not_found=La ressource demandée est introuvable.
error.method_not_allowed=Cette opération n''est pas autorisée sur cette ressource.
error.media_type_unsupported=Le format de la requête n''est pas pris en charge.
error.request.malformed=La requête est mal formée.
error.request.invalid=La requête est invalide.

error.validation.invalid=Valeur invalide.
error.validation.not_blank=Ce champ est obligatoire.
error.validation.not_null=Ce champ est obligatoire.
error.validation.not_empty=Ce champ est obligatoire.
error.validation.size=La longueur doit être comprise entre {2} et {1} caractères.
error.validation.min=La valeur doit être supérieure ou égale à {1}.
error.validation.max=La valeur doit être inférieure ou égale à {1}.
error.validation.email=Adresse e-mail invalide.
error.validation.pattern=Format invalide.
error.validation.past_or_present=La date ne peut pas être dans le futur.
