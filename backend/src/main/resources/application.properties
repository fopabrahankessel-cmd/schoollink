spring.application.name=SchoolLink

# Local dev database from docker-compose.yml (see .env.example); override with env vars elsewhere.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:schoollink}
spring.datasource.username=${DB_USER:schoollink}
spring.datasource.password=${DB_PASSWORD:schoollink}

# Schema is owned by Flyway (task 1.2); Hibernate never changes it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Only the health endpoint is exposed, without details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# NFR-12: error and notification texts in messages_fr/en.properties; no fallback to the server's locale.
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false
spring.messages.always-use-message-format=true

# NFR-7: JWT access token 15 min, refresh token 30 days. The default secret is for local
# development only; the app refuses to start with it under the prod profile. Set JWT_SECRET (32+ bytes).
schoollink.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
schoollink.jwt.access-token-ttl=15m
schoollink.jwt.refresh-token-ttl=30d
