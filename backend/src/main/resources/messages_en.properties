# Notification templates (BR-20, NFR-12), rendered by the notification module. SMS: GSM-7 characters
# only (no dash other than "-", no typographic quotes) and at most 160 characters with a long school
# name. {0} is always the student's first name, except in the invitation.
notification.absence.push.title=Absence: {0}
notification.absence.push.body={0} was marked absent in period {1} ({2}) on {3}.
notification.lateness.push.title=Late arrival: {0}
notification.lateness.push.body={0} arrived late at {1} on {2}.
notification.correction.push.title=Correction: {0}
notification.correction.absence.push.body=The absence recorded for {0} in period {1} on {2} was a mistake and has been cancelled.
notification.correction.lateness.push.body=The late arrival recorded for {0} on {2} was a mistake and has been cancelled.
notification.correction.absence.sms=SchoolLink: correction. The absence recorded for {0} in period {1} on {2} was a mistake. {3}
notification.correction.lateness.sms=SchoolLink: correction. The late arrival recorded for {0} on {2} was a mistake. {3}
notification.summons.push.title=Summons: {0}
notification.summons.push.body=The Discipline Master asks you to come to the school about {0} on {1} at {2}.
notification.summons.sms=SchoolLink: summons from {3}. The Discipline Master expects you on {1} at {2} about {0}.
notification.otp.sms=SchoolLink: your verification code is {0}. It expires in {1} minutes. Never share it.
notification.invitation.sms=SchoolLink: your activation code for {1} is {0}. Enter it in the SchoolLink app before {2}.
notification.digest.absent.sms=SchoolLink: {0} absent {1} on {2}. {3}
notification.digest.late.sms=SchoolLink: {0} late ({4}) on {2}. {3}
notification.digest.both.sms=SchoolLink: {0} absent {1} and late ({4}) on {2}. {3}

# UC-D1: justification by the DM (BR-10 to BR-12)
error.justification.no_records=Choose at least one absence or lateness to justify.
error.justification.too_many_records=Justify at most {0} records at a time.
error.justification.note_not_allowed=For an illness, leave the note empty: no health details are stored.
error.justification.not_an_absence=Only absences can be justified: a student who was present has nothing to justify.
error.justification.record_cancelled=One of these records was cancelled: there is nothing left to justify.
