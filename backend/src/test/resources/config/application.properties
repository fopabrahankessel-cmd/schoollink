# Test classpath only: every Spring test runs with the test profile, which allows the dev-only JWT secret.
spring.profiles.active=test
schoollink.jwt.secret=dev-only-test-jwt-secret-0123456789abcdefghij
# Task 2.6: the outbox poller is off; tests call the dispatcher themselves.
schoollink.outbox.dispatch-enabled=false
# Task 3.4: the nightly detection is off; tests call Detection themselves.
schoollink.detection.nightly-enabled=false
# Task 3.8: the SMS digest job is off; tests call SmsDigest themselves.
schoollink.digest.enabled=false
